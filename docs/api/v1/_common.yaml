                description: "Rate limiting documentation"
              actions:
                retry:
                  href: "http://localhost/v1/profiles"
                  method: "GET"
                  delay: 3600
                  description: "Retry after rate limit resets"

    # ===============================
    # 500 Internal Server Error
    # ===============================
    ServerError:
      description: |
        Internal Server Error - An unexpected error occurred on the server.

        The server encountered an unexpected condition that prevented it from fulfilling the request.
      headers:
        X-Request-ID:
          description: Unique identifier for this request (for debugging)
          schema:
            type: string
            example: "req_abc123def456"
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ServerError'
          examples:
            database_error:
              summary: Database connection error
              value:
                error:
                  code: "DATABASE_ERROR"
                  message: "An internal server error occurred."
                  details: "Unable to connect to the database. Please try again later."
                  timestamp: "2025-07-13T10:30:00.000000Z"
                  request_id: "req_abc123def456"
                data:
                  error_type: "database_error"
                  service: "database"
                  recovery_suggestions:
                    - "Please try again in a few minutes"
                    - "If the problem persists, contact support"
                links:
                  self:
                    href: "http://localhost/v1/profiles"
                    method: "GET"
                  actions:
                    retry:
                      href: "http://localhost/v1/profiles"
                      method: "GET"
                      delay: 60
                      description: "Retry the request after a short delay"
                    contact_support:
                      href: "mailto:support@example.com"
                      description: "Contact support if the issue persists"

    # ===============================
    # 503 Service Unavailable
    # ===============================
    ServiceUnavailableError:
      description: |
        Service Unavailable - The service is temporarily unavailable.

        The server is currently unable to handle the request due to temporary overload or maintenance.
      headers:
        Retry-After:
          description: Seconds to wait before retrying
          schema:
            type: integer
            example: 120
        X-Request-ID:
          schema:
            type: string
            example: "req_abc123def456"
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ServerError'
          example:
            error:
              code: "SERVICE_UNAVAILABLE"
              message: "The service is temporarily unavailable."
              details: "We are performing scheduled maintenance. Service will resume shortly."
              timestamp: "2025-07-13T10:30:00.000000Z"
              request_id: "req_abc123def456"
            data:
              error_type: "configuration_error"
              service: "maintenance"
              maintenance_mode: true
              estimated_recovery: "2025-07-13T12:00:00.000000Z"
              recovery_suggestions:
                - "Please try again after 12:00 PM UTC"
                - "Check our status page for updates"
            links:
              self:
